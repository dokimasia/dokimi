# The overlay of TypeScript. It declares each fixture whose axis is a construct of Go, and each
# difference of TypeScript from the expected outcomes of the corpus of Go.
language: typescript
level: 1
diverge:
  - fixture: iface/lang/arraylength
    stance: blocked
    why: A TypeScript array has no length in its type
  - fixture: iface/lang/crosspackage
    stance: blocked
    why: TypeScript has no internal packages
  - fixture: iface/lang/kinds
    stance: blocked
    why: TypeScript has no kinds of reflect and no channels
  - fixture: iface/lang/namedreturns
    stance: blocked
    why: A TypeScript function returns one value without a name
  - fixture: iface/lang/opaque
    stance: blocked
    why: A TypeScript value does not start from the zero value of its type
  - fixture: iface/lang/resolved
    stance: blocked
    why: A TypeScript value does not start from the zero value of its type
  - fixture: iface/lang/selfnamed
    stance: blocked
    why: A TypeScript interface has no embedded fields

