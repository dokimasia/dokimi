# The conformance spec, which each runtime vendors from a release of dokimi with spec. spec manifest
# writes spec/manifest.json.
definition:
  repo: dokimasia/dokimi
  root: spec
  manifest: manifest.json
  languages: [go, typescript]
  files: [VERSION, "*.json", "schemas/*.json"]
  implementations:
    - {repo: dokimasia/dokimi-go, languages: [go]}
