# The claims: the statements that the classifications of the shape catalog license, with the law
# that each check witnesses. The derivation visits the claims in this order.
claims:
  smoke:
    generator: suite
    licences:
      - callable: true
    law: no-panic-on-any-input
    machineries: [nothing-beyond-a-caller]
    statement: "{callable} returns without a panic for derived inputs"
    probe: survives
    inputs:
      call: {from: callable}
    defect:
      form: panics
      clause: "a {declaration} whose {callable} panics"
      reason: panicked
    since: 1.0.0
  cancel:
    generator: suite
    licences:
      - context: true
    gates: [cancellation, failure]
    law: cancelled-context-is-reported
    machineries: [nothing-beyond-a-caller]
    statement: "{callable} returns an error for a cancelled context"
    probe: under-cancelled
    inputs:
      call: {from: callable}
    defect:
      form: succeeds-always
      clause: "a {declaration} whose {callable} ignores the context"
      reason: ignored-cancel
    since: 1.0.0
  zero-on-error:
    generator: suite
    licences:
      - shape: reader
      - shape: aggregator
      - shape: answering-writer
      - shape: stream-consumer
    unless: default-on-error
    gates: [failure, returns-beside-error, one-value, value-samples]
    law: no-value-beside-an-error
    machineries: [nothing-beyond-a-caller]
    statement: "{callable} returns the zero value beside an error"
    probe: zero-beside-error
    inputs:
      call: {from: callable}
      zero: {from: zero}
    defect:
      form: value-beside
      clause: "a {declaration} whose {callable} returns a value beside an error"
      reason: value-beside-error
    since: 1.0.0
  zeroes-on-error:
    generator: suite
    licences:
      - shape: multi-reader
      - shape: multi-aggregator
    gates: [failure, returns-beside-error, two-values, value-samples]
    law: no-value-beside-an-error
    machineries: [nothing-beyond-a-caller]
    statement: "{callable} returns the zero values beside an error"
    probe: zero-pair-beside-error
    inputs:
      call: {from: callable}
      zero: {from: zero}
    defect:
      form: values-beside
      clause: "a {declaration} whose {callable} returns values beside an error"
      reason: value-beside-error
    since: 1.0.0
  zero-on-miss:
    generator: suite
    licences:
      - shape: reader-with-bool
    gates: [presence-flag, one-value, value-samples]
    law: no-value-beside-a-false-flag
    machineries: [nothing-beyond-a-caller]
    statement: "{callable} returns the zero value beside a false presence flag"
    probe: zero-beside-false
    inputs:
      call: {from: callable}
      zero: {from: zero}
    defect:
      form: value-beside-a-false-flag
      clause: "a {declaration} whose {callable} returns a value beside a false presence flag"
      reason: value-beside-false
    since: 1.0.0
  zeroes-on-miss:
    generator: suite
    licences:
      - shape: lookup
    gates: [presence-flag, two-values, value-samples]
    law: no-value-beside-a-false-flag
    machineries: [nothing-beyond-a-caller]
    statement: "{callable} returns the zero values beside a false presence flag"
    probe: zero-pair-beside-false
    inputs:
      call: {from: callable}
      zero: {from: zero}
    defect:
      form: values-beside-a-false-flag
      clause: "a {declaration} whose {callable} returns values beside a false presence flag"
      reason: value-beside-false
    since: 1.0.0
  nil-on-miss:
    generator: suite
    licences:
      - shape: pointer-reader
    gates: [one-value, optional-value]
    law: miss-returns-the-zero
    machineries: [nothing-beyond-a-caller]
    statement: "{callable} returns nil for an input that nothing stored"
    probe: nil-beside-a-miss
    inputs:
      call: {from: callable}
    defect:
      form: invents-a-pointer
      clause: "a {declaration} whose {callable} returns a value for an input that nothing stored"
      reason: non-nil-miss
    since: 1.0.0
  miss-is-zero:
    generator: suite
    licences:
      - shape: reader-no-error
    gates: [one-value, value-samples]
    law: miss-returns-the-zero
    machineries: [nothing-beyond-a-caller]
    statement: "{callable} returns the zero value for an input that nothing stored"
    probe: zero-beside-a-miss
    inputs:
      call: {from: callable}
      zero: {from: zero}
    defect:
      form: invents-a-value
      clause: "a {declaration} whose {callable} returns a value for an input that nothing stored"
      reason: non-zero-miss
    since: 1.0.0
  deterministic:
    generator: suite
    licences:
      - shape: computation
    gates: [one-value, value-samples]
    law: repeat-returns-alike
    machineries: [nothing-beyond-a-caller]
    statement: "{callable} returns the same value for the same inputs"
    probe: repeat-agrees
    inputs:
      call: {from: callable}
    defect:
      form: drifts
      clause: "a {declaration} whose {callable} returns another value on the repeat"
      reason: unstable-repeat
    since: 1.0.0
  predicate:
    generator: suite
    licences:
      - shape: predicate
    gates: [one-value]
    law: repeat-returns-alike
    machineries: [nothing-beyond-a-caller]
    statement: "{callable} returns the same answer twice for an unchanged subject"
    probe: repeat-agrees
    inputs:
      call: {from: callable}
    defect:
      form: drifts
      clause: "a {declaration} whose {callable} returns another answer on the repeat"
      reason: unstable-repeat
    since: 1.0.0
  repeat-survives:
    generator: suite
    licences:
      - shape: void-lifecycle
    gates: [no-value]
    law: repeated-call-survives
    machineries: [nothing-beyond-a-caller]
    statement: "{callable} returns without a panic when it is called twice"
    probe: survives-repeat
    inputs:
      call: {from: callable}
    defect:
      form: panics-on-repeat
      clause: "a {declaration} whose {callable} panics on the repeat"
      reason: panicked-repeat
    entails: [smoke]
    since: 1.0.0
  miss:
    generator: suite
    licences:
      - mixin: not-found
    gates: [failure, one-value]
    law: miss-reports-the-declared-sentinel
    machineries: [nothing-beyond-a-caller]
    statement: "{callable} fails with the declared sentinel for an input that nothing stored"
    probe: reports-sentinel
    inputs:
      call: {from: callable}
      sentinel: {from: param, param: sentinel}
    defect:
      form: reports-another-error
      clause: "a {declaration} whose {callable} fails with another error for a miss"
      reason: wrong-sentinel
    since: 1.0.0
  idempotent:
    generator: suite
    licences:
      - mixin: idempotent
    gates: [cancellation, failure]
    law: repeat-is-accepted
    machineries: [nothing-beyond-a-caller]
    statement: "a second identical {callable} succeeds after the first"
    probe: repeat-is-quiet
    inputs:
      call: {from: callable}
    defect:
      form: refuses-repeat
      clause: "a {declaration} whose {callable} fails on the second call"
      reason: refused-repeat
    since: 1.0.0
  cacheable:
    generator: suite
    licences:
      - mixin: cacheable
    gates: [one-value]
    law: repeat-returns-alike
    machineries: [nothing-beyond-a-caller]
    statement: "{callable} returns the same value on a repeat"
    probe: repeat-agrees
    inputs:
      call: {from: callable}
    defect:
      form: drifts
      clause: "a {declaration} whose {callable} returns another value on the repeat"
      reason: unstable-repeat
    since: 1.0.0
  pure:
    generator: suite
    licences:
      - mixin: pure
    gates: [one-value]
    law: repeat-returns-alike
    machineries: [nothing-beyond-a-caller]
    statement: "{callable} returns the same value on a repeat"
    probe: repeat-agrees
    inputs:
      call: {from: callable}
    defect:
      form: drifts
      clause: "a {declaration} whose {callable} returns another value on the repeat"
      reason: unstable-repeat
    since: 1.0.0
  read-after-write:
    generator: suite
    licences:
      - mixin: read-after-write
    gates: [cancellation, one-value]
    partners:
      write: {mode: named, param: write}
    law: read-returns-the-write-before-it
    machineries: [nothing-beyond-a-caller]
    statement: "{callable} returns what {write} stored before it"
    probe: write-then-read
    inputs:
      read: {from: callable}
      write: {from: partner, partner: write}
    defect:
      form: forgets-writes
      clause: "a {declaration} whose {write} returns success and stores nothing"
      reason: unobserved-write
    since: 1.0.0
  causal:
    generator: suite
    licences:
      - mixin: causal
    gates: [cancellation, one-value]
    partners:
      write: {mode: derived, param: version}
    law: read-observes-its-causal-past
    machineries: [nothing-beyond-a-caller]
    statement: "{callable} observes the write of {write} that it causally follows"
    probe: write-then-read
    inputs:
      read: {from: callable}
      write: {from: partner, partner: write}
    defect:
      form: forgets-writes
      clause: "a {declaration} whose {write} returns success and stores nothing"
      reason: unobserved-write
    since: 1.0.0
  read-your-writes:
    generator: suite
    licences:
      - mixin: read-your-writes
    gates: [cancellation, one-value]
    partners:
      write: {mode: derived, param: version}
    law: read-observes-its-own-writes
    machineries: [nothing-beyond-a-caller]
    statement: "{callable} observes the preceding {write} of the same client"
    probe: write-then-read
    inputs:
      read: {from: callable}
      write: {from: partner, partner: write}
    defect:
      form: forgets-writes
      clause: "a {declaration} whose {write} returns success and stores nothing"
      reason: unobserved-write
    since: 1.0.0
  monotonic-writes:
    generator: suite
    licences:
      - mixin: monotonic-writes
    gates: [cancellation, one-value]
    partners:
      write: {mode: derived, param: version}
    law: writes-apply-in-issue-order
    machineries: [nothing-beyond-a-caller]
    statement: "{callable} observes the state that the ordered writes of {write} produced"
    probe: write-then-read
    inputs:
      read: {from: callable}
      write: {from: partner, partner: write}
    defect:
      form: forgets-writes
      clause: "a {declaration} whose {write} returns success and stores nothing"
      reason: unobserved-write
    since: 1.0.0
  point-in-time:
    generator: suite
    licences:
      - mixin: point-in-time
    gates: [cancellation, one-value]
    partners:
      write: {mode: interposed, param: write}
    law: read-keeps-its-snapshot
    machineries: [nothing-beyond-a-caller]
    statement: "{callable} returns the same value twice across a {write} between the reads"
    probe: pinned-across-write
    inputs:
      read: {from: callable}
      write: {from: partner, partner: write}
    defect:
      form: drifts
      clause: "a {declaration} whose {callable} returns another value on the second read"
      reason: unpinned-read
    since: 1.0.0
  no-duplicates:
    generator: suite
    licences:
      - mixin: no-duplicates
    gates: [cancellation, list-value]
    partners:
      write: {mode: establishing, shape: writer}
    law: no-element-is-drained-twice
    machineries: [nothing-beyond-a-caller]
    statement: "no element appears twice in one {callable}"
    probe: no-element-twice
    inputs:
      drain: {from: callable}
      write: {from: partner, partner: write}
    defect:
      form: drains-twice
      clause: "a {declaration} whose {callable} returns one element twice"
      reason: repeated-element
    since: 1.0.0
  stable-order:
    generator: suite
    licences:
      - mixin: stable-order
    gates: [cancellation, list-value]
    partners:
      write: {mode: establishing, shape: writer}
    law: two-drains-agree-on-order
    machineries: [nothing-beyond-a-caller]
    statement: "two calls of {callable} return the elements in the same order"
    probe: drains-in-one-order
    inputs:
      drain: {from: callable}
      write: {from: partner, partner: write}
    defect:
      form: reorders-drain
      clause: "a {declaration} whose {callable} reorders the elements between calls"
      reason: reordered-drain
    since: 1.0.0
  permutation:
    generator: suite
    licences:
      - mixin: permutation
    gates: [cancellation, list-value]
    partners:
      write: {mode: establishing, shape: writer}
    law: drain-gains-exactly-what-went-in
    machineries: [nothing-beyond-a-caller]
    statement: "{callable} gains exactly the elements that {write} wrote between two of its calls"
    probe: gains-what-went-in
    inputs:
      drain: {from: callable}
      write: {from: partner, partner: write}
    defect:
      form: drains-nothing
      clause: "a {declaration} whose {callable} loses what {write} wrote"
      reason: miscounted-drain
    since: 1.0.0
  over-match:
    generator: suite
    licences:
      - mixin: over-match
    gates: [cancellation, list-value]
    partners:
      write: {mode: establishing, shape: writer}
    law: drain-keeps-what-went-in
    machineries: [nothing-beyond-a-caller]
    statement: "{callable} gains at least the elements that {write} wrote between two of its calls"
    probe: keeps-what-went-in
    inputs:
      drain: {from: callable}
      write: {from: partner, partner: write}
    defect:
      form: drains-nothing
      clause: "a {declaration} whose {callable} loses what {write} wrote"
      reason: shrunk-drain
    since: 1.0.0
  monotonic:
    generator: suite
    licences:
      - mixin: monotonic
    gates: [one-value, ordered-value, value-samples]
    law: results-never-decrease
    machineries: [nothing-beyond-a-caller]
    statement: "{callable} never returns less than it returned before"
    probe: never-decreases
    inputs:
      call: {from: callable}
    defect:
      form: descends
      clause: "a {declaration} whose {callable} returns less than its previous result"
      reason: regressed
    since: 1.0.0
  monotonic-reads:
    generator: suite
    licences:
      - mixin: monotonic-reads
    gates: [cancellation, one-value, value-samples]
    partners:
      write: {mode: derived, param: version}
    law: reads-never-go-backwards
    machineries: [nothing-beyond-a-caller]
    statement: "{callable} never returns an older version than one that it returned before"
    probe: reads-never-regress
    inputs:
      read: {from: callable}
      write: {from: partner, partner: write}
      version: {from: param, param: version}
    defect:
      form: version-descends
      clause: "a {declaration} whose {callable} returns an older version on the second read"
      reason: regressed
    since: 1.0.0
  writes-follow-reads:
    generator: suite
    licences:
      - mixin: writes-follow-reads
    gates: [cancellation, one-value, value-samples]
    partners:
      write: {mode: derived, param: version}
    law: write-follows-the-read-before-it
    machineries: [nothing-beyond-a-caller]
    statement: "a {write} after {callable} has a version above the version that {callable} returned"
    probe: writes-advance
    inputs:
      read: {from: callable}
      write: {from: partner, partner: write}
      version: {from: param, param: version}
    defect:
      form: answers-a-sample
      clause: "a {declaration} whose {write} is not ordered after the read before it"
      reason: unordered-write
    since: 1.0.0
  xss-safe:
    generator: suite
    licences:
      - mixin: xss-safe
    gates: [cancellation, one-value]
    law: unsafe-value-does-not-survive
    machineries: [nothing-beyond-a-caller]
    statement: "{callable} does not return the value that its directive declares unsafe"
    probe: escapes-the-unsafe
    inputs:
      call: {from: callable}
      unsafe: {from: param, param: unsafe}
    defect:
      form: echoes
      clause: "a {declaration} whose {callable} returns its input unchanged"
      reason: unescaped-output
    since: 1.0.0
  injection-safe:
    generator: suite
    licences:
      - mixin: injection-safe
    gates: [cancellation, failure]
    partners:
      read: {mode: reader, param: read}
    law: unsafe-value-is-kept-as-data
    machineries: [nothing-beyond-a-caller]
    statement: "{read} returns the value that the directive of {callable} declares unsafe, unchanged"
    probe: write-then-read
    inputs:
      write: {from: callable}
      read: {from: partner, partner: read}
    defect:
      form: stores-nothing
      clause: "a {declaration} whose {callable} returns success and stores nothing"
      reason: unobserved-write
    since: 1.0.0
  total:
    generator: suite
    licences:
      - mixin: total
        needs-param: edge
    law: call-accepts-its-declared-domain
    machineries: [nothing-beyond-a-caller]
    statement: "{callable} succeeds for the input that its directive declares at the edge of the domain"
    probe: accepts-the-edge
    inputs:
      call: {from: callable}
      edge: {from: param, param: edge}
    defect:
      form: fails-always
      clause: "a {declaration} whose {callable} fails at the edge of its domain"
      reason: refused-the-edge
    since: 1.0.0
  validates:
    generator: suite
    licences:
      - mixin: validates
    gates: [cancellation, failure]
    partners:
      validate: {mode: named, param: fn}
    law: declared-invalid-value-is-refused
    machineries: [nothing-beyond-a-caller]
    statement: "{callable} refuses the value that {validate} refuses"
    probe: refuses-the-invalid
    inputs:
      call: {from: callable}
      validate: {from: partner, partner: validate}
      invalid: {from: param, param: invalid}
    defect:
      form: accepts-the-invalid
      clause: "a {declaration} whose {callable} accepts a value that {validate} refuses"
      reason: unscreened-write
    since: 1.0.0
  nil-safe:
    generator: suite
    licences:
      - mixin: nil-safe
    gates: [optional-input]
    law: nil-argument-is-accepted
    machineries: [nothing-beyond-a-caller]
    statement: "{callable} returns without a panic for a nil argument"
    probe: survives
    inputs:
      call: {from: callable}
    defect:
      form: panics
      clause: "a {declaration} whose {callable} panics on nil"
      reason: panicked
    since: 1.0.0
  lifecycle-after-close:
    generator: suite
    licences:
      - mixin: lifecycle-after-close
    gates: [cancellation, failure]
    partners:
      close: {mode: named, param: close}
    law: work-after-close-is-refused
    machineries: [nothing-beyond-a-caller]
    statement: "{callable} fails with the declared sentinel after {close}"
    probe: reports-sealed
    inputs:
      call: {from: callable}
      close: {from: partner, partner: close}
      sentinel: {from: param, param: sentinel}
    defect:
      form: succeeds-always
      clause: "a {declaration} whose {callable} works on after {close}"
      reason: alive-after-close
    since: 1.0.0
  order-after:
    generator: suite
    licences:
      - mixin: order-after
    gates: [cancellation, failure]
    law: call-refuses-before-its-predecessor
    machineries: [nothing-beyond-a-caller]
    statement: "{callable} fails with the declared unready sentinel before its declared predecessor"
    probe: refuses-early
    inputs:
      call: {from: callable}
      sentinel: {from: param, param: unready}
    defect:
      form: succeeds-always
      clause: "a {declaration} whose {callable} succeeds before its predecessor ran"
      reason: accepted-early
    since: 1.0.0
  ready-after:
    generator: suite
    licences:
      - mixin: order-after
    gates: [cancellation, failure]
    partners:
      ready: {mode: named, param: fn}
    law: call-works-after-its-predecessor
    machineries: [nothing-beyond-a-caller]
    statement: "{callable} succeeds once {ready} has run"
    probe: works-after
    inputs:
      call: {from: callable}
      ready: {from: partner, partner: ready}
    defect:
      form: fails-always
      clause: "a {declaration} whose {callable} fails also after {ready}"
      reason: never-ready
    since: 1.0.0
  settles:
    generator: suite
    licences:
      - mixin: eventually
    gates: [cancellation, failure]
    partners:
      settle: {mode: named, param: settle}
      observe: {mode: named, param: observe}
    law: effect-arrives-once-settled
    machineries: [nothing-beyond-a-caller]
    statement: "the effect of {callable} reaches {observe} once {settle} has run"
    probe: settles-then-observes
    inputs:
      call: {from: callable}
      settle: {from: partner, partner: settle}
      observe: {from: partner, partner: observe}
    defect:
      form: observation-unmoved
      clause: "a {declaration} whose {observe} returns nothing, settled or not"
      reason: unsettled-effect
    since: 1.0.0
  within:
    generator: suite
    licences:
      - mixin: timeout
    gates: [cancellation, failure]
    law: call-returns-within-its-budget
    machineries: [clock-the-run-advances]
    statement: "{callable} returns before the clock passes the declared budget"
    probe: returns-within
    inputs:
      call: {from: callable}
      budget: {from: param, param: duration}
      clock: {from: clock}
    defect:
      form: slow
      clause: "a {declaration} whose {callable} waits longer than its budget"
      reason: overran-budget
    since: 1.0.0
  windowed:
    generator: suite
    licences:
      - mixin: windowed
    gates: [cancellation, failure]
    partners:
      count: {mode: named, param: count}
    law: count-covers-a-bounded-window
    machineries: [clock-the-run-advances]
    statement: "{count} includes a {callable} inside the declared window and not after it"
    probe: counts-within-window
    inputs:
      call: {from: callable}
      count: {from: partner, partner: count}
      window: {from: param, param: window}
      clock: {from: clock}
    defect:
      form: count-drifts
      clause: "a {declaration} whose {count} keeps every {callable} however far the clock moves"
      reason: misread-window
    since: 1.0.0
  scheduled:
    generator: suite
    licences:
      - mixin: scheduled
    gates: [cancellation, failure]
    partners:
      count: {mode: named, param: runs}
    law: task-runs-once-its-instant-passes
    machineries: [clock-the-run-advances]
    statement: "a task that {callable} registers runs once the clock passes its instant, and not before"
    probe: runs-on-schedule
    inputs:
      call: {from: callable}
      count: {from: partner, partner: count}
      clock: {from: clock}
    defect:
      form: count-drifts
      clause: "a {declaration} that runs each task of {callable} the moment it registers"
      reason: off-schedule
    since: 1.0.0
  time-aware:
    generator: suite
    licences:
      - mixin: time-aware
    gates: [cancellation, one-value]
    partners:
      put: {mode: establishing, shape: writer}
    law: result-depends-on-the-clock
    machineries: [clock-the-run-advances]
    statement: "{callable} returns another value once the clock has moved far enough"
    probe: moves-with-the-clock
    inputs:
      call: {from: callable}
      put: {from: partner, partner: put}
      clock: {from: clock}
