# The stances, and the stance of each classification of the shape catalog that licenses no claim
# and that no claim binds as a partner.
stances:
  silent:
    meaning: The classification implies nothing that a check could falsify, such as a call that returns nothing.
    closes: Nothing.
    since: 1.0.0
  needs:
    meaning: The claim needs a machinery that the run does not supply.
    closes: The param machineries on the declaration, or a runtime that supplies the machinery.
    since: 1.0.0
  declines:
    meaning: dokimi could build the check and rules it out because of its cost.
    closes: A cheaper check.
    since: 1.0.0
  blocked:
    meaning: The check would read a part of the declaration that no generator can read.
    closes: A change of the vocabulary of the shape catalog.
    since: 1.0.0
  gap:
    meaning: The classification implies something that no claim witnesses.
    closes: A new claim in the spec.
    since: 1.0.0
unclaimed:
  shape:writer:
    stance: silent
    note: A write is an input of the other checks, and its result is an error alone.
  shape:composite-writer:
    stance: silent
    note: A write is an input of the other checks, and its result is an error alone.
  shape:multi-arg-writer:
    stance: silent
    note: A write is an input of the other checks, and its result is an error alone.
  shape:mutator:
    stance: silent
    note: A mutation is an input of the other checks, and its result is an error alone.
  shape:deleter:
    stance: silent
    note: A delete is an input of the other checks, and its result is an error alone.
  shape:closer:
    stance: silent
    note: A close returns nothing that a check could compare.
  shape:lifecycle:
    stance: silent
    note: A lifecycle call returns nothing that a check could compare.
  mixin:deprecated:
    stance: silent
    note: The mixin documents the callable.
  mixin:errors:
    stance: silent
    note: The mixin documents the errors of the callable.
  mixin:scope:
    stance: silent
    note: The mixin documents the scope of the callable.
  mixin:integration-only:
    stance: silent
    note: The mixin documents that the callable needs a real dependency.
  mixin:sample:
    stance: silent
    note: The mixin documents the sample of a value.
  mixin:waits:
    stance: silent
    note: The mixin documents that the callable can wait for another call.
  mixin:runs-until-cancelled:
    stance: silent
    note: The mixin documents that the callable runs until its context ends.
  mixin:serializable:
    stance: needs
    note: The claims of the mixin need concurrent callers.
  mixin:snapshot-isolation:
    stance: needs
    note: The claims of the mixin need concurrent callers.
  mixin:default-on-error:
    stance: blocked
    note: The mixin declares no default value for a check to compare.
  mixin:returns-on-error:
    stance: gap
    note: No claim checks that a failed call returns the field of its request.
