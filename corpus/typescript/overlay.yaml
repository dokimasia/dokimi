    gate: returns-beside-error
    why: A TypeScript call that fails throws and returns no value
  - fixture: iface/lang/embedded
    key: composed.get/zero-on-error#generated
    expect: check
    actual: absent
    why: The check of zero-on-error that the generated binding derives from refuses
