# The gates: conditions on the facts of the subject of a claim. A licensed claim whose gate fails is
# a refusal with the reason and the remedy of the gate.
gates:
  failure:
    passes: The error model of the callable is not none.
    why: "{callable} cannot fail"
    remedy: "give {callable} an error result"
    since: 1.0.0
  returns-beside-error:
    passes: The error model of the callable is last-return, so a failed call returns its values beside the error.
    why: "{callable} returns no value when it fails"
    remedy: "remove the classification, because a failed call of {callable} returns no value"
    since: 1.0.0
  returns-unaided:
    passes: The callable has no mixin waits, so a call on a fresh subject returns without the call of another callable.
    why: "{callable} waits for the call of another callable on a fresh subject"
    remedy: "remove the mixin waits where {callable} returns on a fresh subject"
    since: 1.0.0
  returns-before-cancel:
    passes: The callable has no mixin runs-until-cancelled, so a call returns before its context ends.
    why: "{callable} runs until its context ends"
    remedy: "check {callable} with a check of the consumer that ends its context"
    since: 1.0.0
  cancellation:
    passes: A parameter has the role context.
    why: "{callable} takes no context"
    remedy: "add a context parameter to {callable}"
    since: 1.0.0
  one-value:
    passes: The callable returns exactly one value.
    why: "{callable} does not return exactly one value"
    remedy: "return one value from {callable}"
    since: 1.0.0
  two-values:
    passes: The callable returns exactly two values.
    why: "{callable} does not return exactly two values"
    remedy: "return two values from {callable}"
    since: 1.0.0
  no-value:
    passes: The callable returns no value.
    why: "{callable} returns a value"
    remedy: "remove the classification, or return nothing from {callable}"
    since: 1.0.0
  presence-flag:
    passes: A return has the role ok-bool.
    why: "{callable} returns no presence flag"
    remedy: "return a presence flag beside the value of {callable}"
    since: 1.0.0
  optional-value:
    passes: The value result has the optional form.
    why: "the result of {callable} is not optional"
    remedy: "return an optional value from {callable}"
    since: 1.0.0
  list-value:
    passes: The value result is a list, or a return has the role stream.
    why: "{callable} returns no list and no stream"
    remedy: "return a list or a stream from {callable}"
    since: 1.0.0
  ordered-value:
    passes: The value result is an integer, a float or a string.
    why: "the result of {callable} has no order"
    remedy: "return an integer, a float or a string from {callable}"
    since: 1.0.0
  value-samples:
    passes: eidos derives two distinct samples of each value result.
    why: "eidos derives no sample of a result of {callable}"
    remedy: "author a sample of the result type with the directive sample"
    since: 1.0.0
  input-samples:
    passes: eidos derives a sample of each parameter that the check calls the callable with.
    why: "eidos derives no sample of the parameter {param} of {callable}"
    remedy: "author a sample of the parameter {param} with the directive sample"
    since: 1.0.0
  classification-params:
    passes: The classification of the callable sets each param that the claim reads.
    why: "the classification of {callable} sets no param {param}"
    remedy: "set the param {param} in the directive of {callable}"
    since: 1.0.0
  interface-handle:
    passes: The handle that the callable returns is an interface, so the check can plant a handle in its place.
    why: "the handle that {callable} returns is not an interface, so no planted handle can replace it"
    remedy: "return the handle of {callable} as an interface"
    since: 1.0.0
  importable-samples:
    passes: The file of the suite can import each declaration that a sample of the check refers to.
    why: "a sample of the check refers to a declaration that the file of the suite cannot import"
    remedy: "author a sample of each input of {callable} with the directive sample"
    since: 1.0.0
  optional-input:
    passes: A parameter in the role input has the optional form.
    why: "{callable} takes no optional input"
    remedy: "remove the mixin nil-safe, or give {callable} an optional parameter"
    since: 1.0.0
  partner-found:
    passes: The partner mode of the claim binds a callable of the declaration.
    why: "no callable of the declaration is the partner {partner} of {callable}"
    remedy: "name the partner of {callable} with the param of the classification"
    since: 1.0.0
  one-partner:
    passes: The partner mode of the claim binds exactly one callable of the declaration.
    why: "two callables of the declaration can be the partner {partner} of {callable}"
    remedy: "name the partner of {callable} with the param of the classification"
    since: 1.0.0
  partner-arguments:
    passes: Each parameter of the read is a parameter of the write with the same name and type, a field of the written value with its name and type, the context, or a function, or the write takes no input.
    why: "a parameter of the read of {callable} selects neither a value that {partner} takes nor a field of the written value"
    remedy: "align the name of the parameter of the read with a parameter or a field of the write"
    since: 1.0.0
  rewritable:
    passes: The written value has a field that the read does not select by, so a second write can change what the read returns.
    why: "the read selects by every field of the value that {callable} writes"
    remedy: "write a value with a field that the read does not select by"
    since: 1.0.0
  write-returns-the-value:
    passes: Each partner of the claim returns first a value of the type that the callable returns, so the check reads the version of a write from its result.
    why: "the partner {partner} of {callable} returns no value of the type that {callable} returns"
    remedy: "return the written value from the partner {partner} of {callable}"
    since: 1.0.0
  members:
    passes: The enumeration has a variant.
    why: "{declaration} has no variant"
    remedy: "declare a variant of {declaration}"
    since: 1.0.0
  two-members:
    passes: The enumeration has two variants.
    why: "{declaration} has fewer than two variants"
    remedy: "declare a second variant of {declaration}"
    since: 1.0.0
  list-function:
    passes: The enumeration has a function that lists its variants, in its surface or in its package.
    why: "{declaration} has no function that lists its variants"
    remedy: "generate the surface of {declaration}, or declare the function that lists its variants"
    since: 1.0.0
  valid-function:
    passes: The enumeration has a function that judges whether a value is a variant, in its surface or in its package.
    why: "{declaration} has no function that judges whether a value is a variant"
    remedy: "generate the surface of {declaration}, or declare the function that judges a value"
    since: 1.0.0
  outside-value:
    passes: The type of the enumeration has a value that no variant has.
    why: "every value of the type of {declaration} is a variant"
    remedy: "none, because the type has no value outside its variants"
    since: 1.0.0
  parse-function:
    passes: The enumeration has a parse function, in its surface or in its package.
    why: "{declaration} has no parse function"
    remedy: "generate the surface of {declaration}, or declare its parse function"
    since: 1.0.0
  text-encoding:
    passes: The enumeration encodes and decodes its text, as the surface writes it.
    why: "{declaration} does not encode its text"
    remedy: "generate the surface of {declaration} with its text encoding"
    since: 1.0.0
  error-values:
    passes: The package has an error value.
    why: "{declaration} has no error value"
    remedy: "declare an error value in {declaration}"
    since: 1.0.0
  two-error-values:
    passes: The package has two error values, or one and a package under no-overlap-with.
    why: "{declaration} has fewer than two error values"
    remedy: "declare a second error value in {declaration}"
    since: 1.0.0
  error-types:
    passes: The package has an error type.
    why: "{declaration} has no error type"
    remedy: "declare an error type in {declaration}"
    since: 1.0.0
  two-error-types:
    passes: The package has two error types.
    why: "{declaration} has fewer than two error types"
    remedy: "declare a second error type in {declaration}"
    since: 1.0.0
  self-comparing-type:
    passes: An error type compares itself with a hook Is and has no hook Unwrap.
    why: "no error type of {declaration} compares itself"
    remedy: "none, because the claim applies only to an error type that compares itself"
    since: 1.0.0
  error-cause:
    passes: An error type has a cause.
    why: "no error type of {declaration} has a cause"
    remedy: "none, because the claim applies only to an error type with a cause"
    since: 1.0.0
  two-inputs-of-one-type:
    passes: The callable takes exactly two inputs, and both have one type.
    why: "{callable} does not take two inputs of one type"
    remedy: "remove the classification, or give {callable} two inputs of one type"
    since: 1.0.0
  result-of-the-input-type:
    passes: The callable returns one value, and the value has the type of its inputs.
    why: "{callable} does not return one value of the type of its inputs"
    remedy: "remove the classification, or return one value of the type of the inputs of {callable}"
    since: 1.0.0
  context-or-input:
    passes: The callable takes a context or an input, so a check can make a call of it fail.
    why: "{callable} takes neither a context nor an input, so no call on a fresh subject fails"
    remedy: "check the error of {callable} with a check of the consumer, or give {callable} a context"
    since: 1.0.0
  exact-fidelity:
    passes: No classification of the callable states the fidelity lossy.
    why: "the codec of {callable} states the fidelity lossy, and the claim states the exact round trip"
    remedy: "check the lossy round trip of {callable} with a check of the consumer"
    since: 1.0.0
  countable-use:
    passes: The callable that the param observe names returns an integer, or a list, a map or a text whose length is the use.
    why: "the reader that observe names for {callable} returns no number and no length"
    remedy: "name with observe a callable that returns the use of {callable} as a number or a list"
    since: 1.0.0
  numeric-total:
    passes: The callable that the param observe names returns an integer or a float, so a planted defect can add a unit to the total.
    why: "the reader that observe names for {callable} returns no number"
    remedy: "name with observe a callable that returns the total that {callable} moves as a number"
    since: 1.1.0
  delivers-on-a-channel:
    passes: The callable of the role subscribe returns a channel, and the callable passes a value of the type of its elements.
    why: "{subscribe} returns no channel of a value that {callable} passes"
    remedy: "subscribe through a callable that returns a channel of the values that {callable} passes"
    since: 1.1.0
  at-least-once-mode:
    passes: The callable of the role publish states the delivery mode at-least-once, so a redelivery delivers an event once more.
    why: "{publish} states no delivery mode at-least-once, so a redelivery of {callable} need not deliver an event again"
    remedy: "state the delivery mode of {publish}, whose check judges the redeliveries of {callable} under any mode"
    since: 1.1.0
  stream-mutations:
    passes: The callable returns a stream, and the callables that the params mutate and delete name each take a value of the type of its elements.
    why: "{callable} returns no stream of a value that {mutate} and {delete} take"
    remedy: "name with mutate and delete the callables that write and remove an element of the stream of {callable}"
    since: 1.1.0
  subscription-methods:
    passes: The method that the param next names takes a wait and returns an update and a presence flag, the method that the param stop names takes and returns nothing, and the trigger passes a value of the type of the update.
    why: "the methods that next and stop name on the subscription of {callable}, or the value that {trigger} passes, do not fit a read of updates"
    remedy: "name with next a method that takes a wait and returns the update and a flag, and with stop a method without parameters and results"
    since: 1.1.0
  takes-a-replica:
    passes: The callable takes one input that another subject can be, a pointer to the struct of the declaration or an interface that the subject type implements, so a merge can pass it another replica.
    why: "{callable} takes no input that another replica of {declaration} can be"
    remedy: "give {callable} an input of an interface that {declaration} implements"
    since: 1.0.0
  graph-of-states:
    passes: The variable that the param transitions names is a map from the type that observe returns to a list of that type.
    why: "the variable that transitions names for {callable} is no graph of the states that observe reads"
    remedy: "declare transitions as a map from each state to the list of its successors"
    since: 1.0.0
  returns-a-value:
    passes: The callable returns a value on its own before its context ends, so a planted defect of the declaration can change the value.
    why: "no callable of {declaration} returns a value on its own"
    remedy: "give {declaration} a callable that returns a value without the mixin waits or runs-until-cancelled"
    since: 1.0.0
