    expect: absent
    actual: check
    why: The interface Failure of TypeScript extends Error in place of the interface Stream of Go
  - fixture: iface/lang/embeddedforeign
    key: failure.retryable/smoke
    expect: absent
    actual: check
    why: The interface Failure of TypeScript extends Error in place of the interface Stream of Go
  - fixture: iface/lang/embeddedforeign
    key: stream.close/smoke
    expect: check
    actual: absent
