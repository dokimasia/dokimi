  # Every TypeScript callable can fail, so a callable without an error of Go has the claims of a
  # callable that fails, and a tuple is one value of TypeScript.
  - fixture: iface/lang/dynamic
    key: diary.count/deterministic
    expect: check
    actual: absent
    why: Every TypeScript callable can fail, so the shape catalog does not classify count as a computation
  - fixture: iface/lang/dynamic
    key: diary.count/zero-on-error
    expect: absent
    actual: refused
    gate: returns-beside-error
    why: Every TypeScript callable can fail, and a call that fails throws and returns no value
  - fixture: iface/lang/dynamic
    key: diary.in/smoke
    expect: absent
    actual: check
    why: Every TypeScript callable can fail, so in is a writer, whose smoke check takes its input, in place of a mutator
  - fixture: iface/lang/dynamic
    key: diary.in/smoke#generated
    expect: absent
    actual: check
    why: Every TypeScript callable can fail, so in is a writer, whose smoke check takes its input, in place of a mutator
  - fixture: iface/lang/dynamic
