# The rules of the claims of the spec: the classifications of the shape catalog that license each
# claim, the gates that bind it, the inputs and partners of its check, and the clause of its
# planted defect. The key of each entry is the identifier of a claim of the spec.
claims:
  smoke:
    generator: suite
    licences:
      - callable: true
    gates: [returns-unaided, returns-before-cancel]
    inputs:
      call: {from: callable}
    clause: "a {declaration} whose {callable} panics"
  cancel:
    generator: suite
    licences:
      - context: true
    gates: [cancellation, failure, returns-before-cancel]
    inputs:
      call: {from: callable}
    clause: "a {declaration} whose {callable} ignores the context"
  failure-is-reported:
    generator: suite
    licences:
      - callable: true
    gates: [failure, returns-before-cancel]
    inputs:
      call: {from: callable}
    clause: "a {declaration} whose {callable} returns no error when its dependency fails"
  zero-on-error:
    generator: suite
    licences:
      - shape: reader
      - shape: aggregator
      - shape: answering-writer
      - shape: stream-consumer
    unless: default-on-error
    gates: [failure, returns-beside-error, one-value, value-samples, returns-unaided, context-or-input, returns-before-cancel, returns-no-field]
    inputs:
      call: {from: callable}
      zero: {from: zero}
    clause: "a {declaration} whose {callable} returns a value beside an error"
  returns-on-error:
    generator: suite
    licences:
      - mixin: returns-on-error
    gates: [failure, returns-beside-error, one-value, value-samples, returns-unaided, context-or-input, returns-before-cancel]
    inputs:
      call: {from: callable}
      field: {from: param, param: result, default: "."}
      want: {from: param, param: field}
    clause: "a {declaration} whose {callable} returns the zero value of its result in place of the field of its request"
  zeroes-on-error:
    generator: suite
    licences:
      - shape: multi-reader
      - shape: multi-aggregator
    gates: [failure, returns-beside-error, two-values, value-samples, returns-unaided, context-or-input, returns-before-cancel]
    inputs:
      call: {from: callable}
      zero: {from: zero}
    clause: "a {declaration} whose {callable} returns values beside an error"
  zero-on-miss:
    generator: suite
    licences:
      - shape: reader-with-bool
    gates: [presence-flag, one-value, value-samples, returns-unaided, returns-before-cancel]
    inputs:
      call: {from: callable}
      zero: {from: zero}
    clause: "a {declaration} whose {callable} returns a value beside a false presence flag"
  zeroes-on-miss:
    generator: suite
    licences:
      - shape: lookup
    gates: [presence-flag, two-values, value-samples, returns-unaided, returns-before-cancel]
    inputs:
      call: {from: callable}
      zero: {from: zero}
    clause: "a {declaration} whose {callable} returns values beside a false presence flag"
  nil-on-miss:
    generator: suite
    licences:
      - shape: pointer-reader
    gates: [one-value, optional-value, returns-unaided, returns-before-cancel]
    inputs:
      call: {from: callable}
    clause: "a {declaration} whose {callable} returns a value for an input that nothing stored"
  miss-is-zero:
    generator: suite
    licences:
      - shape: reader-no-error
    gates: [one-value, value-samples, returns-unaided, returns-before-cancel]
    inputs:
      call: {from: callable}
      zero: {from: zero}
    clause: "a {declaration} whose {callable} returns a value for an input that nothing stored"
  deterministic:
    generator: suite
    licences:
      - shape: computation
    gates: [one-value, value-samples, returns-unaided, returns-before-cancel, stable-subject]
    inputs:
      call: {from: callable}
    clause: "a {declaration} whose {callable} returns another value on the repeat"
    entails: [smoke]
  predicate:
    generator: suite
    licences:
      - shape: predicate
    gates: [one-value, returns-unaided, returns-before-cancel, stable-subject]
    inputs:
      call: {from: callable}
    clause: "a {declaration} whose {callable} returns another answer on the repeat"
  repeat-survives:
    generator: suite
    licences:
      - shape: void-lifecycle
    gates: [no-value, returns-unaided, returns-before-cancel]
    inputs:
      call: {from: callable}
    clause: "a {declaration} whose {callable} panics on the repeat"
  miss:
    generator: suite
    licences:
      - mixin: not-found
    gates: [failure, one-value]
    inputs:
      call: {from: callable}
      sentinel: {from: param, param: sentinel}
    clause: "a {declaration} whose {callable} fails with another error for a miss"
  idempotent:
    generator: suite
    licences:
      - mixin: idempotent
    gates: [cancellation, failure]
    inputs:
      call: {from: callable}
    clause: "a {declaration} whose {callable} fails on the second call"
  cacheable:
    generator: suite
    licences:
      - mixin: cacheable
    gates: [one-value]
    inputs:
      call: {from: callable}
    clause: "a {declaration} whose {callable} returns another value on the repeat"
  pure:
    generator: suite
    licences:
      - mixin: pure
    gates: [one-value]
    inputs:
      call: {from: callable}
    clause: "a {declaration} whose {callable} returns another value on the repeat"
  commutative:
    generator: suite
    licences:
      - mixin: commutative
    gates: [two-inputs-of-one-type, one-value]
    inputs:
      call: {from: callable}
      first: {from: input, position: 0}
      second: {from: input, position: 1}
    clause: "a {declaration} whose {callable} ignores its second input"
  associative:
    generator: suite
    licences:
      - mixin: associative
    gates: [two-inputs-of-one-type, result-of-the-input-type]
    inputs:
      call: {from: callable}
      first: {from: input, position: 0}
      second: {from: input, position: 1}
      third: {from: input, position: 1, sample: 1}
    clause: "a {declaration} whose {callable} keeps the value of its first call"
  read-after-write:
    generator: suite
    licences:
      - mixin: read-after-write
    gates: [cancellation, one-value]
    partners:
      write: {mode: named, param: write}
    inputs:
      read: {from: callable}
      write: {from: partner, partner: write}
    clause: "a {declaration} whose {callable} returns a value that {write} did not write"
  causal:
    generator: suite
    licences:
      - mixin: causal
    gates: [cancellation, one-value]
    partners:
      write: {mode: derived, param: version}
    inputs:
      read: {from: callable}
      write: {from: partner, partner: write}
    clause: "a {declaration} whose {callable} returns a value that {write} did not write"
  read-your-writes:
    generator: suite
    licences:
      - mixin: read-your-writes
    gates: [cancellation, one-value]
    partners:
      write: {mode: derived, param: version}
    inputs:
      read: {from: callable}
      write: {from: partner, partner: write}
    clause: "a {declaration} whose {callable} returns a value that {write} did not write"
  monotonic-writes:
    generator: suite
    licences:
      - mixin: monotonic-writes
    gates: [cancellation, one-value]
    partners:
      write: {mode: derived, param: version}
    inputs:
      read: {from: callable}
      write: {from: partner, partner: write}
    clause: "a {declaration} whose {callable} returns a value that {write} did not write"
  point-in-time:
    generator: suite
    licences:
      - mixin: point-in-time
    gates: [cancellation, one-value]
    partners:
      write: {mode: interposed, param: write}
    inputs:
      read: {from: callable}
      write: {from: partner, partner: write}
    clause: "a {declaration} whose {callable} returns another value on the second read"
  no-duplicates:
    generator: suite
    licences:
      - mixin: no-duplicates
    gates: [cancellation, list-value]
    partners:
      write: {mode: establishing, shape: writer}
    inputs:
      drain: {from: callable}
      write: {from: partner, partner: write}
    clause: "a {declaration} whose {callable} returns one element twice"
  stable-order:
    generator: suite
    licences:
      - mixin: stable-order
    gates: [cancellation, list-value]
    partners:
      write: {mode: establishing, shape: writer}
    inputs:
      drain: {from: callable}
      write: {from: partner, partner: write}
    clause: "a {declaration} whose {callable} reorders the elements between calls"
  permutation:
    generator: suite
    licences:
      - mixin: permutation
    gates: [cancellation, list-value]
    partners:
      write: {mode: establishing, shape: writer}
    inputs:
      drain: {from: callable}
      write: {from: partner, partner: write}
    clause: "a {declaration} whose {callable} loses what {write} wrote"
  over-match:
    generator: suite
    licences:
      - mixin: over-match
    gates: [cancellation, list-value]
    partners:
      write: {mode: establishing, shape: writer}
    inputs:
      drain: {from: callable}
      write: {from: partner, partner: write}
    clause: "a {declaration} whose {callable} loses what {write} wrote"
  monotonic:
    generator: suite
    licences:
      - mixin: monotonic
    gates: [one-value, ordered-value, value-samples]
    inputs:
      call: {from: callable}
    clause: "a {declaration} whose {callable} returns less than its previous result"
  monotonic-reads:
    generator: suite
    licences:
      - mixin: monotonic-reads
    gates: [cancellation, one-value, value-samples]
    partners:
      write: {mode: derived, param: version}
    inputs:
      read: {from: callable}
      write: {from: partner, partner: write}
      version: {from: param, param: version}
    clause: "a {declaration} whose {callable} returns an older version on the second read"
  writes-follow-reads:
    generator: suite
    licences:
      - mixin: writes-follow-reads
    gates: [cancellation, one-value, value-samples, write-returns-the-value]
    partners:
      write: {mode: derived, param: version}
    inputs:
      read: {from: callable}
      write: {from: partner, partner: write}
      version: {from: param, param: version}
    clause: "a {declaration} whose {write} is not ordered after the read before it"
  xss-safe:
    generator: suite
    licences:
      - mixin: xss-safe
    gates: [cancellation, one-value]
    inputs:
      call: {from: callable}
      unsafe: {from: param, param: unsafe}
    clause: "a {declaration} whose {callable} returns its input unchanged"
  injection-safe:
    generator: suite
    licences:
      - mixin: injection-safe
    gates: [cancellation, failure]
    partners:
      read: {mode: reader, param: read}
    inputs:
      write: {from: callable}
      read: {from: partner, partner: read}
    clause: "a {declaration} whose {callable} returns success and stores nothing"
  total:
    generator: suite
    licences:
      - mixin: total
        needs-param: edge
    gates: [failure]
    inputs:
      call: {from: callable}
      edge: {from: param, param: edge}
    clause: "a {declaration} whose {callable} fails at the edge of its domain"
  validates:
    generator: suite
    licences:
      - mixin: validates
    gates: [cancellation, failure]
    partners:
      validate: {mode: named, param: fn}
    inputs:
      call: {from: callable}
      validate: {from: partner, partner: validate}
      invalid: {from: param, param: invalid}
    clause: "a {declaration} whose {callable} accepts a value that {validate} refuses"
  nil-safe:
    generator: suite
    licences:
      - mixin: nil-safe
    gates: [optional-input]
    inputs:
      call: {from: callable}
    clause: "a {declaration} whose {callable} panics on nil"
  lifecycle-after-close:
    generator: suite
    licences:
      - mixin: lifecycle-after-close
    gates: [cancellation, failure]
    partners:
      close: {mode: named, param: close}
    inputs:
      call: {from: callable}
      close: {from: partner, partner: close}
      sentinel: {from: param, param: sentinel}
    clause: "a {declaration} whose {callable} works on after {close}"
  order-after:
    generator: suite
    licences:
      - mixin: order-after
    gates: [cancellation, failure]
    inputs:
      call: {from: callable}
      sentinel: {from: param, param: unready}
    clause: "a {declaration} whose {callable} succeeds before its predecessor ran"
  ready-after:
    generator: suite
    licences:
      - mixin: order-after
    gates: [cancellation, failure]
    partners:
      ready: {mode: named, param: fn}
    inputs:
      call: {from: callable}
      ready: {from: partner, partner: ready}
    clause: "a {declaration} whose {callable} fails also after {ready}"
  settles:
    generator: suite
    licences:
      - mixin: eventually
    gates: [cancellation, failure]
    partners:
      settle: {mode: named, param: settle}
      observe: {mode: named, param: observe}
    inputs:
      call: {from: callable}
      settle: {from: partner, partner: settle}
      observe: {from: partner, partner: observe}
    clause: "a {declaration} whose {observe} returns nothing, settled or not"
  within:
    generator: suite
    licences:
      - mixin: timeout
    gates: [cancellation, failure]
    inputs:
      call: {from: callable}
      budget: {from: param, param: duration}
      clock: {from: clock}
    clause: "a {declaration} whose {callable} waits longer than its budget"
  windowed:
    generator: suite
    licences:
      - mixin: windowed
    gates: [cancellation, failure]
    partners:
      count: {mode: named, param: count}
    inputs:
      call: {from: callable}
      count: {from: partner, partner: count}
      window: {from: param, param: window}
      clock: {from: clock}
    clause: "a {declaration} whose {count} keeps every {callable} however far the clock moves"
  scheduled:
    generator: suite
    licences:
      - mixin: scheduled
    gates: [cancellation, failure]
    partners:
      count: {mode: named, param: runs}
    inputs:
      call: {from: callable}
      count: {from: partner, partner: count}
      clock: {from: clock}
    clause: "a {declaration} that runs each task of {callable} the moment it registers"
  time-aware:
    generator: suite
    licences:
      - mixin: time-aware
    gates: [cancellation, one-value]
    partners:
      put: {mode: establishing, shape: writer}
    inputs:
      call: {from: callable}
      put: {from: partner, partner: put}
      clock: {from: clock}
    clause: "a {declaration} whose {callable} returns the same value however far the clock moves"
  steady:
    generator: suite
    licences:
      - mixin: time-aware
    gates: [cancellation, one-value]
    partners:
      put: {mode: establishing, shape: writer}
    inputs:
      call: {from: callable}
      put: {from: partner, partner: put}
      clock: {from: clock}
    clause: "a {declaration} whose {callable} returns another value while nothing moved"
  expires:
    generator: suite
    licences:
      - mixin: ttl
    gates: [cancellation, one-value]
    partners:
      write: {mode: named, param: put}
    inputs:
      read: {from: callable}
      write: {from: partner, partner: write}
      lifetime: {from: param, param: duration}
      sentinel: {from: param, param: not-found}
      clock: {from: clock}
    clause: "a {declaration} whose {callable} returns an entry after its lifetime"
  delete-removes:
    generator: suite
    licences:
      - mixin: delete-removes
    gates: [cancellation, failure]
    partners:
      read: {mode: named, param: read}
      put: {mode: establishing, shape: writer}
    inputs:
      call: {from: callable}
      put: {from: partner, partner: put}
      read: {from: partner, partner: read}
      sentinel: {from: param, param: sentinel}
    clause: "a {declaration} whose {read} returns a key after {callable}"
  side-effect:
    generator: suite
    licences:
      - mixin: side-effect
    gates: [cancellation, failure]
    partners:
      observe: {mode: named, param: observe}
    inputs:
      call: {from: callable}
      observe: {from: partner, partner: observe}
    clause: "a {declaration} whose {callable} leaves {observe} unchanged"
  poisonable:
    generator: suite
    licences:
      - mixin: poisonable
    gates: [failure]
    partners:
      induce: {mode: named, param: induce}
    inputs:
      call: {from: callable}
      induce: {from: partner, partner: induce}
    clause: "a {declaration} whose {callable} succeeds after {induce}"
  tamper-evident:
    generator: suite
    licences:
      - mixin: tamper-evident
    gates: [cancellation, failure]
    partners:
      tamper: {mode: named, param: tamper}
      verify: {mode: named, param: verify}
    inputs:
      call: {from: callable}
      verify: {from: partner, partner: verify}
      tamper: {from: partner, partner: tamper}
    clause: "a {declaration} whose {verify} returns no error after {tamper}"
  retry-succeeds-tx:
    generator: suite
    licences:
      - mixin: retry-succeeds
        needs-param: attempts
        with: {contract: tx, role: commit}
    gates: [cancellation, failure]
    partners:
      begin: {mode: role, role: begin}
    inputs:
      call: {from: callable}
      begin: {from: partner, partner: begin}
      attempts: {from: param, param: attempts}
    clause: "a {declaration} whose {callable} never succeeds"
  retry-succeeds:
    generator: suite
    licences:
      - mixin: retry-succeeds
        needs-param: attempts
        conflicts: [{contract: tx, role: commit}]
    gates: [cancellation, failure]
    inputs:
      call: {from: callable}
      attempts: {from: param, param: attempts}
    clause: "a {declaration} whose {callable} never succeeds"
  retry-succeeds-under-faults:
    generator: suite
    licences:
      - mixin: retry-succeeds
        needs-param: attempts
        conflicts: [{contract: tx, role: commit}]
    gates: [cancellation, failure]
    inputs:
      call: {from: callable}
      attempts: {from: param, param: attempts}
    clause: "a {declaration} whose {callable} keeps failing once its dependency failed"
    entails: [retry-succeeds]
  hooks:
    generator: suite
    licences:
      - mixin: hooks
    gates: [cancellation, failure]
    partners:
      register: {mode: named, param: register}
    inputs:
      call: {from: callable}
      register: {from: partner, partner: register}
    clause: "a {declaration} whose {register} never installs the hook"
  accumulates:
    generator: suite
    licences:
      - mixin: accumulates
    gates: [cancellation, failure]
    partners:
      observe: {mode: named, param: observe}
    inputs:
      call: {from: callable}
      observe: {from: partner, partner: observe}
    clause: "a {declaration} whose repeated {callable} has one effect"
  partition:
    generator: suite
    licences:
      - mixin: partition
    gates: [cancellation, failure]
    partners:
      read: {mode: reader, param: read}
    inputs:
      write: {from: callable}
      read: {from: partner, partner: read}
    clause: "a {declaration} whose {callable} keeps no partition"
  persister:
    generator: suite
    licences:
      - contract: persister
        role: writer
    gates: [cancellation, one-value]
    partners:
      read: {mode: role, role: reader}
    inputs:
      write: {from: callable}
      read: {from: partner, partner: read}
    clause: "a {declaration} whose {callable} returns success and stores nothing"
  chain-causal:
    generator: suite
    licences:
      - contract: chain
        role: append
        with: {mixin: causal}
    gates: [cancellation, failure]
    partners:
      replay: {mode: role, role: replay}
    inputs:
      call: {from: callable}
      replay: {from: partner, partner: replay}
    clause: "a {declaration} whose {replay} returns the history of {callable} reversed"
  chain:
    generator: suite
    licences:
      - contract: chain
        role: append
    gates: [cancellation, failure]
    partners:
      replay: {mode: role, role: replay}
    inputs:
      call: {from: callable}
      replay: {from: partner, partner: replay}
    clause: "a {declaration} whose {callable} returns success and appends nothing"
  appender:
    generator: suite
    licences:
      - contract: appender
        role: fn
    gates: [one-value, ordered-value, value-samples]
    inputs:
      call: {from: callable}
    clause: "a {declaration} whose {callable} returns a position that is not above the last"
  codec:
    generator: suite
    licences:
      - contract: codec
        role: forward
    gates: [cancellation, one-value, exact-fidelity]
    partners:
      inverse: {mode: role, role: inverse}
    inputs:
      call: {from: callable}
      inverse: {from: partner, partner: inverse}
    clause: "a {declaration} whose {callable} returns another encoding on every call"
  if-absent:
    generator: suite
    licences:
      - contract: if-absent
        role: writer
        conflicts: [{mixin: idempotent}]
    gates: [cancellation, failure]
    inputs:
      call: {from: callable}
      sentinel: {from: param, param: conflict}
    clause: "a {declaration} whose {callable} accepts the duplicate"
  lease:
    generator: suite
    licences:
      - contract: lease
        role: acquire
        conflicts: [{mixin: idempotent}]
    gates: [cancellation, failure]
    inputs:
      call: {from: callable}
      sentinel: {from: param, param: taken}
    clause: "a {declaration} whose {callable} grants a lease that it holds"
  cas:
    generator: suite
    licences:
      - contract: cas
        role: writer
        conflicts: [{mixin: idempotent}]
    gates: [cancellation, failure]
    inputs:
      call: {from: callable}
      sentinel: {from: param, param: mismatch}
    clause: "a {declaration} whose {callable} accepts a write on a version that it has moved past"
  if-match:
    generator: suite
    licences:
      - contract: if-match
        role: writer
        needs-param: field
    gates: [cancellation, failure]
    partners:
      match: {mode: role, role: match}
    inputs:
      call: {from: callable}
      match: {from: partner, partner: match}
    clause: "a {declaration} whose {callable} accepts a write that {match} rejects"
  cursor:
    generator: suite
    licences:
      - contract: cursor
        role: next
    gates: [cancellation, failure]
    partners:
      close: {mode: role, role: close}
    inputs:
      call: {from: callable}
      close: {from: partner, partner: close}
      sentinel: {from: param, param: sentinel}
    clause: "a {declaration} whose {callable} keeps draining after {close}"
  cursor-open:
    generator: suite
    licences:
      - contract: cursor
        role: open
    gates: [cancellation, failure]
    inputs:
      call: {from: callable}
      close: {from: param, param: close-method}
      after: {from: param, param: next-method}
      sentinel: {from: param, param: sentinel}
    clause: "a {declaration} whose {callable} returns a cursor that drains after its close"
  rate-limit:
    generator: suite
    licences:
      - contract: rate-limit
        role: fn
    gates: [cancellation, failure]
    inputs:
      call: {from: callable}
      burst: {from: param, param: burst}
      sentinel: {from: param, param: limited}
    clause: "a {declaration} whose {callable} admits calls past the declared burst"
  leader-election:
    generator: suite
    licences:
      - contract: leader-election
        role: campaign
    gates: [cancellation, failure]
    partners:
