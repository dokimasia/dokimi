  # A TypeScript function type and an interface with a method have no zero value, and eidos derives
  # no sample of either. A request with such a field then has no sample, so cancel refuses and smoke
  # is silent.
  - fixture: iface/lang/nested
    key: dispatcher.dispatch/cancel
    expect: check
    actual: refused
    gate: input-samples
    why: eidos derives no sample of a request with a field of a function type or of an interface with a method
  - fixture: iface/lang/nested
    key: dispatcher.dispatch/smoke
    expect: check
    actual: absent
    why: The smoke check of a callable without a sample of its request is silent
  - fixture: iface/lang/nested
    key: dispatcher.dispatch-all/cancel
    expect: check
    actual: refused
    gate: input-samples
    why: eidos derives no sample of a batch of requests with a field of a function type or of an interface with a method
  - fixture: iface/lang/nested
    key: dispatcher.dispatch-all/smoke
    expect: check
    actual: absent
    why: The smoke check of a callable without a sample of its batch is silent

  # V8 counts no allocations of a call, so a TypeScript budget has no ceiling of allocations or bytes.
  - fixture: iface/lang/nested
    key: dispatcher.dispatch/allocation-budget
    expect: ceiling
    actual: absent
    stance: blocked
    why: V8 counts no allocations of a call
  - fixture: iface/lang/nested
    key: dispatcher.dispatch-all/allocation-budget
    expect: ceiling
    actual: absent
    stance: blocked
    why: V8 counts no allocations of a call
