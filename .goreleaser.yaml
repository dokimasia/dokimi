# Managed by ergon init. Add repository settings to .ergon/local/.goreleaser.yaml and run ergon init sync.
#
# The commands of the root module, which the key binaries of the section go of .ergon.yaml lists.
# ergon release pack builds, packs and signs them for each release of the module in the job pack of
# release.yml: it tags the commit with the tag of the module, and runs GoReleaser in snapshot mode
# with the version of the release in ERGON_VERSION. ergon release publish attaches the assets to the
# release of the tag before it publishes the release.

version: 2

project_name: dokimi

dist: dist/goreleaser/dokimi

snapshot:
  version_template: "{{ .Env.ERGON_VERSION }}"

# Each command with completions writes the scripts of bash, zsh and fish with its command
# completion, and its archives, packages and cask contain them.
before:
  hooks:
    - sh -c 'mkdir -p dist/completions/dokimi && for s in bash zsh fish; do go -C . run ./cmd/dokimi completion "$s" > "dist/completions/dokimi/dokimi.$s"; done'

# A static binary without the paths of the runner, the symbol table and DWARF data. Go writes the
# version of the module from its tag, and applies a default.pgo beside the main package. The build
# <name>-upx has the Linux targets of a command, and UPX packs each of its binaries with LZMA, whose
# packed binaries syft still reads. UPX refuses macOS binaries, and syft reads no packed Windows
# binary, so the build <name> of the other targets has no UPX.
#
# A command with cgo builds every target on Linux with zig as its C compiler, which ergon release
# pack names in ERGON_ZIG: a static musl binary for Linux, a mingw binary for Windows, and a Mach-O
# binary for macOS 13.0 or later, the oldest macOS that Go supports. The build <name>-darwin has the
# macOS targets of the command. It links against the text stubs of the libraries of macOS that the
# Go toolchain imports, which ergon release pack writes into ERGON_DARWIN_STUBS.
builds:
  - id: dokimi
    dir: .
    main: ./cmd/dokimi
    binary: dokimi
    env:
      - CGO_ENABLED=1
      - 'CC="{{ .Env.ERGON_ZIG }}" cc -target {{ if eq .Arch "amd64" }}x86_64{{ else }}aarch64{{ end }}-windows-gnu'
    flags: [-trimpath]
    ldflags: [-s -w]
    mod_timestamp: "{{ .CommitTimestamp }}"
    targets:
      - windows_amd64_v1
      - windows_arm64_v8.0
  - id: dokimi-darwin
    dir: .
    main: ./cmd/dokimi
    binary: dokimi
    env:
      - CGO_ENABLED=1
      - 'CC="{{ .Env.ERGON_ZIG }}" cc -target {{ if eq .Arch "amd64" }}x86_64{{ else }}aarch64{{ end }}-macos.13.0'
      - 'CGO_LDFLAGS="-L{{ .Env.ERGON_DARWIN_STUBS }}" "-F{{ .Env.ERGON_DARWIN_STUBS }}"'
    flags: [-trimpath]
    ldflags: [-s -w]
    mod_timestamp: "{{ .CommitTimestamp }}"
    targets:
      - darwin_amd64_v1
      - darwin_arm64_v8.0
  - id: dokimi-upx
    dir: .
    main: ./cmd/dokimi
    binary: dokimi
    env:
      - CGO_ENABLED=1
      - 'CC="{{ .Env.ERGON_ZIG }}" cc -target {{ if eq .Arch "amd64" }}x86_64{{ else }}aarch64{{ end }}-linux-musl'
    flags: [-trimpath]
    ldflags: [-s -w]
    mod_timestamp: "{{ .CommitTimestamp }}"
    targets:
      - linux_amd64_v1
      - linux_arm64_v8.0
    hooks:
      post:
        - ergon tool run go.upx -- --best --lzma --quiet "{{ .Path }}"

# The files of each archive have a fixed owner and mode and the time of the commit, so the bytes of
# an archive do not depend on the runner.
archives:
  - id: dokimi
    ids: [dokimi, dokimi-darwin, dokimi-upx]
    formats: [tar.gz]
    name_template: "dokimi_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    builds_info: {owner: root, group: root, mtime: "{{ .CommitDate }}"}
    files:
      - src: LICENSE*
        info: {owner: root, group: root, mode: 0644, mtime: "{{ .CommitDate }}"}
      - src: NOTICE
        info: {owner: root, group: root, mode: 0644, mtime: "{{ .CommitDate }}"}
      - src: README.md
        info: {owner: root, group: root, mode: 0644, mtime: "{{ .CommitDate }}"}
      - src: dist/completions/dokimi/*
        dst: completions
        strip_parent: true
        info: {owner: root, group: root, mode: 0644, mtime: "{{ .CommitDate }}"}

nfpms:
  - id: dokimi
    ids: [dokimi, dokimi-darwin, dokimi-upx]
    package_name: dokimi
    file_name_template: '{{ replace .ConventionalFileName "~" "-" }}'
    vendor: "Dokimasia B.V."
    maintainer: "Dokimasia B.V. <security@dokimi.dev>"
    homepage: https://github.com/dokimasia/dokimi
    description: "Generates the tests and test helpers of Go and TypeScript code from directives"
    license: Apache-2.0
    formats: [deb, rpm, apk]
    bindir: /usr/bin
    section: utils
    mtime: "{{ .CommitDate }}"
    contents:
      - src: dist/completions/dokimi/dokimi.bash
        dst: /usr/share/bash-completion/completions/dokimi
        file_info: {mode: 0644, mtime: "{{ .CommitDate }}"}
      - src: dist/completions/dokimi/dokimi.zsh
        dst: /usr/share/zsh/vendor-completions/_dokimi
        file_info: {mode: 0644, mtime: "{{ .CommitDate }}"}
      - src: dist/completions/dokimi/dokimi.fish
        dst: /usr/share/fish/vendor_completions.d/dokimi.fish
        file_info: {mode: 0644, mtime: "{{ .CommitDate }}"}
      - src: LICENSE
        dst: /usr/share/doc/dokimi/copyright
        file_info: {mode: 0644, mtime: "{{ .CommitDate }}"}
      - src: NOTICE
        dst: /usr/share/doc/dokimi/NOTICE
        file_info: {mode: 0644, mtime: "{{ .CommitDate }}"}
    deb:
      lintian_overrides:
        - statically-linked-binary
        - changelog-file-missing-in-native-package

source:
  enabled: true
  name_template: "dokimi_{{ .Version }}_source"

checksum:
  name_template: checksums.txt
  algorithm: sha256

# cosign signs checksums.txt with the OIDC identity of the workflow, without a key.
signs:
  - cmd: ergon
    signature: "${artifact}.sigstore.json"
    args: [tool, run, go.cosign, --, sign-blob, "--bundle=${signature}", "${artifact}", --yes]
    artifacts: checksum

# syft writes an SPDX SBOM of each archive and each package, which checksums.txt lists.
# It reads the license of each Go module of a binary from the module proxy. GOPRIVATE names the
# modules of the release, which ergon release pack passes in ERGON_MODULES, so syft does not ask
# the proxy for a version before the publish creates its tag.
sboms:
  - id: archives
    cmd: ergon
    args: [tool, run, go.syft, --, "$artifact", --output, "spdx-json=$document", --enrich, all]
    env: ["GOPRIVATE={{ .Env.ERGON_MODULES }}"]
    artifacts: archive
  - id: packages
    cmd: ergon
    args: [tool, run, go.syft, --, "$artifact", --output, "spdx-json=$document", --enrich, all]
    env: ["GOPRIVATE={{ .Env.ERGON_MODULES }}"]
    artifacts: package

# ergon release ci homebrew commits each cask to the tap after the publish. The hook removes the
# quarantine attribute on macOS, because the binaries are not notarized.
homebrew_casks:
  - name: dokimi
    ids: [dokimi]
    binaries: [dokimi]
    homepage: https://github.com/dokimasia/dokimi
    description: "Generates the tests and test helpers of Go and TypeScript code from directives"
    license: Apache-2.0
    url:
      template: "https://github.com/dokimasia/dokimi/releases/download/v{{ .Version }}/{{ .ArtifactName }}"
    completions:
      bash: completions/dokimi.bash
      zsh: completions/dokimi.zsh
      fish: completions/dokimi.fish
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/dokimi"]
          end
    repository:
      owner: dokimasia
      name: homebrew-tap
    skip_upload: true

# ergon creates the release of the tag, and changesets writes its notes.
changelog:
  disable: true

release:
  disable: true

metadata:
  mod_timestamp: "{{ .CommitTimestamp }}"
