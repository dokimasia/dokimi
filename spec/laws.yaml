# The laws: statements about a subject that are true or false. depth is the machinery at which a
# check witnesses the law in full.
laws:
  no-panic-on-any-input:
    statement: A call with derived inputs returns without a panic.
    depth: generated-inputs
    distinct-from: []
    since: 1.0.0
  cancelled-context-is-reported:
    statement: A call with a cancelled context returns an error.
    depth: nothing-beyond-a-caller
    distinct-from: []
    since: 1.0.0
  no-value-beside-an-error:
    statement: A call that fails returns the zero value of each value result.
    depth: nothing-beyond-a-caller
    distinct-from: []
    since: 1.0.0
  no-value-beside-a-false-flag:
    statement: A call that returns a false presence flag returns the zero value of each value result.
    depth: nothing-beyond-a-caller
    distinct-from: []
    since: 1.0.0
  miss-returns-the-zero:
    statement: A read of an input that nothing stored returns the zero value.
    depth: nothing-beyond-a-caller
    distinct-from: []
    since: 1.0.0
  repeat-returns-alike:
    statement: Two calls with the same inputs on an unchanged subject return the same value.
    depth: generated-inputs
    distinct-from: []
    since: 1.0.0
  repeated-call-survives:
    statement: A second call after a first call returns without a panic.
    depth: nothing-beyond-a-caller
    distinct-from:
      - law: no-panic-on-any-input
        case: A subject that survives the first call and panics on the second.
    since: 1.0.0
  miss-reports-the-declared-sentinel:
    statement: A read of an input that nothing stored fails with the declared sentinel.
    depth: nothing-beyond-a-caller
    distinct-from: []
    since: 1.0.0
  repeat-is-accepted:
    statement: A second identical call succeeds after the first.
    depth: nothing-beyond-a-caller
    distinct-from: []
    since: 1.0.0
  read-returns-the-write-before-it:
    statement: A read returns the value of the write before it.
    depth: generated-sequences
    distinct-from: []
    since: 1.0.0
  read-observes-its-causal-past:
    statement: A read observes every write that it causally follows.
    depth: concurrent-callers
    distinct-from: []
    since: 1.0.0
  read-observes-its-own-writes:
    statement: A read of a client observes every write of the same client before it.
    depth: generated-sequences
    distinct-from: []
    since: 1.0.0
  writes-apply-in-issue-order:
    statement: The writes of one client apply in the order in which the client issued them.
    depth: generated-sequences
    distinct-from: []
    since: 1.0.0
  read-keeps-its-snapshot:
    statement: Two reads of one snapshot return the same value across a write between them.
    depth: concurrent-callers
    distinct-from: []
    since: 1.0.0
  no-element-is-drained-twice:
    statement: One drain returns each element at most once.
    depth: generated-sequences
    distinct-from: []
    since: 1.0.0
  two-drains-agree-on-order:
    statement: Two drains of the same elements return them in the same order.
    depth: generated-sequences
    distinct-from: []
    since: 1.0.0
  drain-gains-exactly-what-went-in:
    statement: A drain gains exactly the elements that were written since the drain before it.
    depth: generated-sequences
    distinct-from:
      - law: drain-keeps-what-went-in
        case: A drain that returns each written element and one element that nobody wrote.
    since: 1.0.0
  drain-keeps-what-went-in:
    statement: A drain gains at least the elements that were written since the drain before it.
    depth: generated-sequences
    distinct-from: []
    since: 1.0.0
  results-never-decrease:
    statement: Each result is at least the result before it.
    depth: generated-sequences
    distinct-from: []
    since: 1.0.0
  reads-never-go-backwards:
    statement: A read of a client never returns a version below a version that the client read before.
    depth: generated-sequences
    distinct-from: []
    since: 1.0.0
  write-follows-the-read-before-it:
    statement: A write after a read has a version above the version that the read returned.
    depth: generated-sequences
    distinct-from: []
    since: 1.0.0
  unsafe-value-does-not-survive:
    statement: The output of a call does not contain the value that the directive declares unsafe.
    depth: generated-inputs
    distinct-from: []
    since: 1.0.0
  unsafe-value-is-kept-as-data:
    statement: A read returns the value that the directive declares unsafe exactly as the write stored it.
    depth: generated-inputs
    distinct-from:
      - law: read-returns-the-write-before-it
        case: A store that returns derived values and changes the control characters of the unsafe value.
    since: 1.0.0
  call-accepts-its-declared-domain:
    statement: A call with the input at the edge of its declared domain succeeds.
    depth: generated-inputs
    distinct-from: []
    since: 1.0.0
  declared-invalid-value-is-refused:
    statement: A call with a value that its declared validator refuses fails.
    depth: generated-inputs
    distinct-from: []
    since: 1.0.0
  nil-argument-is-accepted:
    statement: A call with nil for an optional argument returns without a panic.
    depth: nothing-beyond-a-caller
    distinct-from: []
    since: 1.0.0
  work-after-close-is-refused:
    statement: A call after the close fails with the declared sentinel.
    depth: nothing-beyond-a-caller
    distinct-from: []
    since: 1.0.0
  call-refuses-before-its-predecessor:
    statement: A call before its declared predecessor fails with the declared sentinel.
    depth: nothing-beyond-a-caller
    distinct-from:
      - law: call-works-after-its-predecessor
        case: A subject that refuses every call, before the predecessor and after it.
    since: 1.0.0
  call-works-after-its-predecessor:
    statement: A call after its declared predecessor succeeds.
    depth: nothing-beyond-a-caller
    distinct-from: []
    since: 1.0.0
  effect-arrives-once-settled:
    statement: The named observation shows the effect of a call once the subject has settled.
    depth: nothing-beyond-a-caller
    distinct-from: []
    since: 1.0.0
  call-returns-within-its-budget:
    statement: A call returns before the clock passes its declared budget.
    depth: clock-the-run-advances
    distinct-from: []
    since: 1.0.0
  count-covers-a-bounded-window:
    statement: A count includes each occurrence inside its declared window and none outside it.
    depth: clock-the-run-advances
    distinct-from: []
    since: 1.0.0
  task-runs-once-its-instant-passes:
    statement: A registered task runs once the clock passes its instant, and not before.
    depth: clock-the-run-advances
    distinct-from: []
    since: 1.0.0
  result-depends-on-the-clock:
    statement: A result changes once the clock has moved far enough.
    depth: clock-the-run-advances
    distinct-from:
      - law: result-is-stable-while-the-clock-stops
        case: A subject that reads the wall clock in place of the clock that it was given.
    since: 1.0.0
  result-is-stable-while-the-clock-stops:
    statement: Two calls return the same value while the clock does not move.
    depth: clock-the-run-advances
    distinct-from: []
    since: 1.0.0
  entry-lapses-on-the-clock:
    statement: A read of an entry fails with the declared sentinel once the clock passes the lifetime of the entry.
    depth: clock-the-run-advances
    distinct-from: []
    since: 1.0.0
  delete-makes-the-key-unreadable:
    statement: A read of a key after its delete fails with the declared sentinel.
    depth: nothing-beyond-a-caller
    distinct-from: []
    since: 1.0.0
  call-moves-the-named-observation:
    statement: A call changes the observation that the directive names.
    depth: nothing-beyond-a-caller
    distinct-from: []
    since: 1.0.0
  induced-failure-latches:
    statement: Each call after the induced failure fails.
    depth: nothing-beyond-a-caller
    distinct-from: []
    since: 1.0.0
  tamper-is-detected:
    statement: The verify of a value fails once the value has been tampered with.
    depth: nothing-beyond-a-caller
    distinct-from: []
    since: 1.0.0
  call-converges-once-its-scope-is-open:
    statement: A call inside an open transaction succeeds within the declared attempts.
    depth: nothing-beyond-a-caller
    distinct-from: []
    since: 1.0.0
  call-converges-within-the-declared-attempts:
    statement: A call succeeds within the declared attempts.
    depth: call-that-fails-on-demand
    distinct-from: []
    since: 1.0.0
  registered-hook-runs:
    statement: A call runs each hook that the registrar installed.
    depth: nothing-beyond-a-caller
    distinct-from: []
    since: 1.0.0
  repeated-calls-compound:
    statement: Each call changes the named observation again.
    depth: generated-sequences
    distinct-from: []
    since: 1.0.0
  one-partition-does-not-serve-another:
    statement: A read in one partition never returns the value of another partition.
    depth: nothing-beyond-a-caller
    distinct-from: []
    since: 1.0.0
  history-replays-in-its-stamped-order:
    statement: The replay returns the entries in the order of their stamps.
    depth: generated-sequences
    distinct-from: []
    since: 1.0.0
  admitted-entry-grows-the-replay:
    statement: An admitted append grows the replay by one entry.
    depth: nothing-beyond-a-caller
    distinct-from: []
    since: 1.0.0
  append-returns-above-the-last:
    statement: An append returns a position above the position of the append before it.
    depth: generated-sequences
    distinct-from:
      - law: results-never-decrease
        case: An append that returns the same position twice.
    since: 1.0.0
  encoding-survives-its-round-trip:
    statement: The inverse returns the value that went into the forward call.
    depth: generated-inputs
    distinct-from: []
    since: 1.0.0
  write-is-refused-where-its-key-exists:
    statement: A write for a key that exists fails with the declared conflict.
    depth: nothing-beyond-a-caller
    distinct-from: []
    since: 1.0.0
  granted-lease-is-not-granted-twice:
    statement: An acquire of a held lease fails with the declared sentinel.
    depth: concurrent-callers
    distinct-from: []
    since: 1.0.0
  write-is-refused-on-a-stale-version:
    statement: A write that carries a version that the cell has moved past fails with the declared mismatch.
    depth: nothing-beyond-a-caller
    distinct-from: []
    since: 1.0.0
  write-is-refused-where-the-predicate-rejects-it:
    statement: A write of a value that the predicate rejects fails.
    depth: nothing-beyond-a-caller
    distinct-from: []
    since: 1.0.0
  burst-is-spent-then-refused:
    statement: A call after the declared burst fails with the declared sentinel.
    depth: nothing-beyond-a-caller
    distinct-from: []
    since: 1.0.0
  resigned-leadership-is-released:
    statement: The leadership read reports no leadership after the resign.
    depth: nothing-beyond-a-caller
    distinct-from: []
    since: 1.0.0
  failed-scope-leaves-nothing:
    statement: A read finds nothing that a failed scope wrote.
    depth: nothing-beyond-a-caller
    distinct-from: []
    since: 1.0.0
  failed-commit-leaves-nothing:
    statement: A read finds nothing that a scope wrote before its commit failed.
    depth: call-that-fails-on-demand
    distinct-from:
      - law: failed-scope-leaves-nothing
        case: A scope that rolls back a failed commit and keeps what a failed body wrote.
    since: 1.0.0
  failed-dependency-is-reported:
    statement: A call returns an error when a call of its dependency fails.
    depth: call-that-fails-on-demand
    distinct-from: []
    since: 1.0.0
  failed-call-leaves-no-effect:
    statement: A reader finds no effect of a call that failed.
    depth: generated-sequences
    distinct-from:
      - law: refused-write-leaves-nothing
        case: A writer that keeps nothing of a refused value and keeps a part of a write whose dependency failed.
    since: 1.0.0
  open-breaker-skips-the-operation:
    statement: After repeated failures of its operation, the callable refuses a call without calling the operation.
    depth: call-that-fails-on-demand
    distinct-from: []
    since: 1.0.0
  one-key-one-instance:
    statement: Calls with one value of the key go to one instance while it is healthy.
    depth: call-that-fails-on-demand
    distinct-from: []
    since: 1.0.0
  failure-path-releases:
    statement: The callable releases each resource that it acquired, on every path of a failure.
    depth: call-that-fails-on-demand
    distinct-from: []
    since: 1.0.0
  cache-agrees-with-its-backing:
    statement: The cache returns the value of its backing.
    depth: generated-sequences
    distinct-from: []
    since: 1.0.0
  settled-transaction-is-not-settled-again:
    statement: A second settlement of a transaction fails with the declared sentinel.
    depth: nothing-beyond-a-caller
    distinct-from: []
    since: 1.0.0
  borrowed-value-is-taken-back:
    statement: The put accepts the value that the get lent.
    depth: nothing-beyond-a-caller
    distinct-from: []
    since: 1.0.0
  walk-resumes-where-it-left-off:
    statement: A read with the cursor of a page returns the page after it.
    depth: nothing-beyond-a-caller
    distinct-from: []
    since: 1.0.0
  compensation-accepts-its-step:
    statement: The compensation accepts the step that the call applied.
    depth: nothing-beyond-a-caller
    distinct-from: []
    since: 1.0.0
  refused-write-leaves-nothing:
    statement: The reader finds no part of a write that the call refused.
    depth: nothing-beyond-a-caller
    distinct-from: []
    since: 1.0.0
  second-write-replaces-the-first:
    statement: A read after two writes for one key returns the value of the second write.
    depth: nothing-beyond-a-caller
    distinct-from:
      - law: repeated-write-keeps-one-key
        case: A store that accumulates the two writes under one key.
    since: 1.0.0
  repeated-write-keeps-one-key:
    statement: A second write for one key updates that key and adds no other.
    depth: nothing-beyond-a-caller
    distinct-from: []
    since: 1.0.0
  variants-are-listed-in-order:
    statement: The list of the variants contains each variant once, in the order of the declaration.
    depth: nothing-beyond-a-caller
    distinct-from: []
    since: 1.0.0
  each-variant-has-its-own-text:
    statement: Each variant renders its declared text, and no two variants render one text.
    depth: nothing-beyond-a-caller
    distinct-from: []
    since: 1.0.0
  only-the-variants-are-valid:
    statement: Each variant is valid, and a value outside the variants is not.
    depth: nothing-beyond-a-caller
    distinct-from: []
    since: 1.0.0
  text-parses-to-its-variant:
    statement: The text of each variant parses back to the variant, and the text of no variant fails with the error of the parse function.
    depth: generated-inputs
    distinct-from: []
    since: 1.0.0
  variant-encodes-its-text:
    statement: Each variant encodes its own text.
    depth: nothing-beyond-a-caller
    distinct-from: []
    since: 1.0.0
  text-decodes-to-its-variant:
    statement: The text of each variant decodes to the variant, and the text of no variant fails to decode.
    depth: generated-inputs
    distinct-from: []
    since: 1.0.0
  error-value-has-its-own-message:
    statement: Each error value has a message that opens with the opening of the package and differs from the message of each other error value.
    depth: nothing-beyond-a-caller
    distinct-from: []
    since: 1.0.0
  error-values-are-distinct:
    statement: No error value of a package matches another error value of the package or of a package under no-overlap-with.
    depth: nothing-beyond-a-caller
    distinct-from: []
    since: 1.0.0
  error-type-has-its-own-message:
    statement: The message of an error type opens with the opening of the package and contains each member of text.
    depth: nothing-beyond-a-caller
    distinct-from: []
    since: 1.0.0
  self-compared-type-agrees-with-identity:
    statement: The hook Is of an error type agrees with the identity of the language on each error value of the package.
    depth: nothing-beyond-a-caller
    distinct-from: []
    since: 1.0.0
  error-type-returns-its-cause:
    statement: An error type with a cause returns the cause that it was given.
    depth: nothing-beyond-a-caller
    distinct-from: []
    since: 1.0.0
  error-types-are-distinct:
    statement: No value of an error type matches another error type of the package.
    depth: nothing-beyond-a-caller
    distinct-from: []
    since: 1.0.0
  combining-ignores-the-order:
    statement: Combining two values in either order returns one value.
    depth: generated-inputs
    distinct-from: []
    since: 1.0.0
  combining-ignores-the-grouping:
    statement: Combining three values in either grouping returns one value.
    depth: generated-inputs
    distinct-from: []
    since: 1.0.0
  batch-read-returns-each-stored-value:
    statement: A batch read returns the stored value of each key, in the order of the keys.
    depth: nothing-beyond-a-caller
    distinct-from: []
    since: 1.0.0
  fresh-receiver-is-healthy:
    statement: The accessor of a fresh receiver reports no error.
    depth: nothing-beyond-a-caller
    distinct-from: []
    since: 1.0.0
  positions-are-below-the-size:
    statement: The callable admits each position below the size of the collection and refuses the position equal to the size.
    depth: nothing-beyond-a-caller
    distinct-from: []
    since: 1.0.0
  wrapper-returns-what-its-sibling-returns:
    statement: The callable returns what its sibling returns for one input.
    depth: nothing-beyond-a-caller
    distinct-from: []
    since: 1.0.0
  appended-chain-verifies:
    statement: The verify of a chain that appends alone produced reports no error.
    depth: nothing-beyond-a-caller
    distinct-from: []
    since: 1.0.0
  released-lease-is-granted-again:
    statement: An acquire after the release of a lease succeeds.
    depth: nothing-beyond-a-caller
    distinct-from: []
    since: 1.0.0
  stats-move-with-a-loan:
    statement: The stats of a pool change when the pool lends an object.
    depth: nothing-beyond-a-caller
    distinct-from: []
    since: 1.0.0
  every-sequence-agrees-with-the-reference:
    statement: Each call of any sequence returns on the subject what it returns on the reference.
    depth: generated-sequences
    distinct-from: []
    since: 1.0.0
  use-is-within-its-bounds:
    statement: The use that the reader of the resource reads is between the lower and the upper bound after each call of any sequence.
    depth: generated-sequences
    distinct-from: []
    since: 1.0.0
  merge-order-does-not-matter:
    statement: Two replicas that any sequences of writes made diverge read the same state after a merge in either order.
    depth: generated-sequences
    distinct-from: []
    since: 1.0.0
  states-follow-the-graph:
    statement: Each state that the reader reads after a call is the state before the call or one of its successors in the graph.
    depth: generated-sequences
    distinct-from: []
    since: 1.0.0
  moves-conserve-the-total:
    statement: Each call of the callable leaves the total of the quantity unchanged.
    depth: generated-sequences
    distinct-from: []
    since: 1.1.0
  iteration-reflects-its-source:
    statement: The rest of an iteration yields each value that a mutation wrote while it ran and no value that a delete removed while it ran.
    depth: generated-sequences
    distinct-from: []
    since: 1.1.0
  each-append-is-delivered:
    statement: Each message that an append recorded arrives on the channel of a subscription at least once.
    depth: generated-sequences
    distinct-from: []
    since: 1.1.0
  deliveries-follow-the-mode:
    statement: Each published event arrives at least once, at most once or exactly once, as the delivery mode states.
    depth: generated-sequences
    distinct-from: []
    since: 1.1.0
  redelivery-delivers-again:
    statement: Each event that a redelivery passed arrives once more than its publishes alone deliver.
    depth: generated-sequences
    distinct-from: []
    since: 1.1.0
  watch-returns-each-trigger:
    statement: A subscription returns each update that a trigger of its key caused after the watch started, in order, and no update after its stop.
    depth: generated-sequences
    distinct-from: []
    since: 1.1.0
  no-second-reply:
    statement: A machine returns at most one reply to each inbound call.
    depth: simulated-system
    distinct-from: []
    since: 1.1.0
  stop-replies-to-each-call:
    statement: On the stop event, a machine replies to each inbound call that it has not replied to.
    depth: simulated-system
    distinct-from: []
    since: 1.1.0
  no-effect-after-stop:
    statement: From the stop event on, a machine returns replies alone.
    depth: simulated-system
    distinct-from: []
    since: 1.1.0
  no-effect-after-error:
    statement: A machine returns no effect after the step in which its error method returns an error.
    depth: simulated-system
    distinct-from: []
    since: 1.1.0
  no-reused-token:
    statement: Each effect that starts a call or a wait has a token that no earlier effect of its machine in the same epoch has.
    depth: simulated-system
    distinct-from: []
    since: 1.1.0
  concurrent-history-is-linearizable:
    statement: Every history of concurrent calls has an order that keeps the real-time order of its calls and in which the reference returns the same results.
    depth: concurrent-callers
    distinct-from: []
    since: 1.1.0
  reads-beside-reads-return-what-one-read-returns:
    statement: A read that runs beside other reads, without a write, returns what it returns with the same arguments when it runs alone.
    depth: concurrent-callers
    distinct-from: []
    since: 1.1.0
  calls-at-once-share-one-computation:
    statement: Calls with one key that run at once share one computation of their result.
    depth: concurrent-callers
    distinct-from: []
    since: 1.1.0
  acknowledged-write-survives-a-crash:
    statement: A write that returned success is readable after a crash.
    depth: killable-process-or-breakable-medium
    distinct-from: []
    since: 1.1.0
  recovery-returns-whole-records:
    statement: Recovery after a crash during a write returns each record whole or not at all.
    depth: killable-process-or-breakable-medium
    distinct-from: []
    since: 1.1.0
  corrupted-read-is-reported:
    statement: A read of a corrupted record fails with the declared error and returns no value.
    depth: killable-process-or-breakable-medium
    distinct-from: []
    since: 1.1.0
  refused-write-leaves-the-state:
    statement: A write that the medium cannot hold fails, and the state is as before the write.
    depth: killable-process-or-breakable-medium
    distinct-from: []
    since: 1.1.0
  failure-returns-the-request-field:
    statement: A call that fails returns the value that the field of its request had before the call.
    depth: nothing-beyond-a-caller
    distinct-from:
      - law: no-value-beside-an-error
        case: A read that returns the zero value beside an error for a request whose field is not the zero value.
    since: 1.2.0
  concurrent-transactions-are-serializable:
    statement: Every history of concurrent transactions has a serial order of its committed transactions in which each read returns the same result.
    depth: concurrent-callers
    distinct-from: []
    since: 1.2.0
  concurrent-transactions-are-snapshot-isolated:
    statement: Every history of concurrent transactions has no anomaly that snapshot isolation excludes, such as a dirty read or a lost update.
    depth: concurrent-callers
    distinct-from:
      - law: concurrent-transactions-are-serializable
        case: Two transactions that each read the key that the other writes and both commit, a write skew that snapshot isolation permits.
    since: 1.2.0
